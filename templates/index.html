<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to MediMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-box fade-in-up">
            <div class="icon">
                <i class="bi bi-hospital-fill"></i>
            </div>
            <h1>MediMate</h1>
            <p class="lead">Your family's personal health companion.</p>
            <div class="quote-box">
                <p>"The greatest wealth is health, and the greatest joy is family. Let's protect both together."</p>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center mt-2">
                <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg px-5">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </a>
                <a href="{{ url_for('register') }}" class="btn btn-outline-secondary btn-lg px-5">
                    <i class="bi bi-person-plus me-2"></i>Register
                </a>
            </div>
            <div class="mt-4 d-flex justify-content-center gap-4" style="font-size:0.8rem;color:#94a3b8;">
                <span><i class="bi bi-shield-check me-1"></i>Secure</span>
                <span><i class="bi bi-people me-1"></i>Family Profiles</span>
                <span><i class="bi bi-bell me-1"></i>Smart Reminders</span>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
